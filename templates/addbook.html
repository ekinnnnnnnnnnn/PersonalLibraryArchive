<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>
            Adding book
        </title>
    </head>
    <body>
        <h2>
            Add book
        </h2>
        {% if error %}
        <p>
            {{ error }}
        </p>
        {% endif %}
        <form action="/addbook" method="post" enctype="multipart/form-data">
            Book name: <input type="text" name="bookname" required><br><br>
            Author: <input type="text" name="author" pattern="[a-zA-ZçÇğĞıİöÖşŞüÜ\s]+" title="Author name must contain only letters and spaces." required><br><br>
            Type: <input type="text" name="type" pattern="[a-zA-ZçÇğĞıİöÖşŞüÜ\s]+" title="Book type must contain only letters and spaces." required><br><br>
            Total Page: <input type="number" name="tPage" min="1" title="Total pages must be at least 1." required><br><br>
            Read Page: <input type="number" name="rPage" min="0" value="0" title="Read pages cannot be negative."><br><br>
            Status: 
            <select name="status">
                <option value="not read">not read</option>
                <option value="reading">reading</option>
                <option value="read">read</option>
            </select><br><br>
            Rating (only for read):
            <select name="rating">
                <option value="">--</option>
                <option value="1">1/10</option>
                <option value="2">2/10</option>
                <option value="3">3/10</option>
                <option value="4">4/10</option>
                <option value="5">5/10</option>
                <option value="6">6/10</option>
                <option value="7">7/10</option>
                <option value="8">8/10</option>
                <option value="9">9/10</option>
                <option value="10">10/10</option>
            </select><br><br>
            PDF File: <input type="file" name="pdfFile" accept=".pdf"><br><br>
            Image File: <input type="file" name="imageFile" accept="image/*"><br><br>
            Comment / Note: <br>
            <textarea name="comment" rows="3" cols="35" placeholder="Comments"></textarea><br><br>
            <input type="submit" value="add">
        </form>
        <br>
        <a href="/">Return library</a>
    </body>
</html>
